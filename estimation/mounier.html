<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Avis de Valeur Vénale — Grange Rénovée Saint-Martin-le-Pin</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 10mm 14mm 10mm 14mm;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 10.5px;
      line-height: 1.42;
      color: #1a202c;
    }

    .no-print-bar {
      max-width: 180mm;
      margin: 15px auto 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a365d;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
    }
    .btn-print {
      background: #ffffff;
      color: #1a365d;
      border: none;
      padding: 8px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-print:hover {
      background: #edf2f7;
    }

    .sheet-page {
      width: 100%;
      max-width: 180mm;
      min-height: 270mm;
      margin: 18px auto;
      background: #ffffff;
      padding: 22px 26px;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media print {
      body {
        background: transparent !important;
      }
      .no-print-bar {
        display: none !important;
      }
      .sheet-page {
        width: 100% !important;
        max-width: 100% !important;
        min-height: 275mm !important;
        height: 275mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        page-break-after: always;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
      }
      .sheet-page:last-child {
        page-break-after: auto;
      }
    }

    .content-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      border-bottom: 2px solid #1a365d;
      padding-bottom: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-container img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }
    .advisor-info {
      border-left: 2px solid #e2e8f0;
      padding-left: 14px;
      font-size: 9.5px;
      line-height: 1.4;
      color: #4a5568;
    }
    .advisor-name {
      font-size: 12px;
      font-weight: bold;
      color: #1a365d;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .advisor-role {
      color: #718096;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .advisor-contact {
      color: #2b6cb0;
      font-weight: 500;
    }
    .header-doc-title {
      text-align: right;
    }
    .header-doc-title h1 {
      margin: 0;
      font-size: 16px;
      color: #1a365d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .header-doc-title p {
      margin: 3px 0 0 0;
      font-size: 9.5px;
      color: #4a5568;
      font-weight: 500;
    }

    .section-title {
      background: #1a365d;
      color: #ffffff;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 5px 10px;
      border-radius: 4px;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    .identity-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 14px;
      margin-bottom: 6px;
    }
    .identity-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
    }
